name: Apply factual search prompt migration

on:
  push:
    branches:
      - feature/richer-web-search
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/richer-web-search
          fetch-depth: 0

      - name: Patch existing default prompt migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/newoether/agora/data/SettingsManager.kt")
          text = path.read_text()
          old = (
              "            val migratedPrompts = migrateLegacyDefaultPromptTitle(currentPrompts, locale)\n"
              "            val runtimeMigrated = migrateOldRuntimeContext(migratedPrompts, locale)\n"
              "            if (runtimeMigrated != currentPrompts) {\n"
              "                prefs[SYSTEM_PROMPTS_JSON] = json.encodeToString(runtimeMigrated)\n"
              "            }\n"
              "            if (looksLikeFreshInstall) {\n"
              "                if (runtimeMigrated.isEmpty()) {\n"
          )
          new = (
              "            val migratedPrompts = migrateLegacyDefaultPromptTitle(currentPrompts, locale)\n"
              "            val runtimeMigrated = migrateOldRuntimeContext(migratedPrompts, locale)\n"
              "            val webSearchGuidanceMigrated =\n"
              "                runtimeMigrated.map(DefaultSystemPrompt::migrateLegacyWebSearchGuidance)\n"
              "            if (webSearchGuidanceMigrated != currentPrompts) {\n"
              "                prefs[SYSTEM_PROMPTS_JSON] = json.encodeToString(webSearchGuidanceMigrated)\n"
              "            }\n"
              "            if (looksLikeFreshInstall) {\n"
              "                if (webSearchGuidanceMigrated.isEmpty()) {\n"
          )
          if old not in text:
              raise SystemExit("Expected SettingsManager migration block not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/newoether/agora/data/SettingsManager.kt
          git commit -m "prompt: migrate factual search guidance"
          git push origin HEAD:feature/richer-web-search
