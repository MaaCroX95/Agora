name: Apply factual search prompt migration

on:
  push:
    branches:
      - feature/richer-web-search
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/richer-web-search
          fetch-depth: 0

      - name: Patch existing default prompt migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/newoether/agora/data/SettingsManager.kt')
          text = path.read_text()
          old = '''            val migratedPrompts = migrateLegacyDefaultPromptTitle(currentPrompts, locale)
            val runtimeMigrated = migrateOldRuntimeContext(migratedPrompts, locale)
            if (runtimeMigrated != currentPrompts) {
                prefs[SYSTEM_PROMPTS_JSON] = json.encodeToString(runtimeMigrated)
            }
            if (looksLikeFreshInstall) {
                if (runtimeMigrated.isEmpty()) {
'''
          new = '''            val migratedPrompts = migrateLegacyDefaultPromptTitle(currentPrompts, locale)
            val runtimeMigrated = migrateOldRuntimeContext(migratedPrompts, locale)
            val webSearchGuidanceMigrated =
                runtimeMigrated.map(DefaultSystemPrompt::migrateLegacyWebSearchGuidance)
            if (webSearchGuidanceMigrated != currentPrompts) {
                prefs[SYSTEM_PROMPTS_JSON] = json.encodeToString(webSearchGuidanceMigrated)
            }
            if (looksLikeFreshInstall) {
                if (webSearchGuidanceMigrated.isEmpty()) {
'''
          if old not in text:
              raise SystemExit('Expected SettingsManager migration block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/newoether/agora/data/SettingsManager.kt
          git commit -m "prompt: migrate factual search guidance"
          git push origin HEAD:feature/richer-web-search
