name: Apply OpenAI Search CI fixes

on:
  push:
    branches:
      - feature/richer-web-search
    paths:
      - .github/workflows/apply-openai-search-ci-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/richer-web-search
          fetch-depth: 0

      - name: Apply focused CI fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Existing strict MockK test must expose the newly consulted global StateFlow.
          replace_once(
              "app/src/test/java/com/newoether/agora/viewmodel/GenerationRequestBuilderProviderDisplayTest.kt",
              '        every { settings.googleSearchEnabled } returns MutableStateFlow(false)\n        every { settings.thinkingEnabled }',
              '        every { settings.googleSearchEnabled } returns MutableStateFlow(false)\n        every { settings.openAiWebSearchEnabled } returns MutableStateFlow(true)\n        every { settings.thinkingEnabled }',
          )

          # SettingsResourceContractTest requires every default string key in every localized values-* pack.
          translations = {
              "values-ar": "السماح ببحث OpenAI المستضاف من المزوّد لمحادثات Responses المتوافقة مع OpenAI. يكون معطلاً افتراضيًا؛ ويمكن تعطيله لكل محادثة عند تمكينه عالميًا.",
              "values-de": "Anbietergehostete OpenAI-Suche für OpenAI-kompatible Responses-Unterhaltungen zulassen. Standardmäßig deaktiviert; bei globaler Aktivierung kann sie für einzelne Unterhaltungen deaktiviert werden.",
              "values-es": "Permite la búsqueda de OpenAI alojada por el proveedor en conversaciones Responses compatibles con OpenAI. Desactivada de forma predeterminada; puede desactivarse por conversación cuando está habilitada globalmente.",
              "values-fr": "Autoriser la recherche OpenAI hébergée par le fournisseur pour les conversations Responses compatibles avec OpenAI. Désactivée par défaut ; elle peut être désactivée pour chaque conversation lorsqu’elle est activée globalement.",
              "values-ja": "OpenAI 互換の Responses 会話で、プロバイダー側の OpenAI Search を許可します。既定ではオフで、グローバルに有効化した場合でも会話ごとにオフにできます。",
              "values-ko": "OpenAI 호환 Responses 대화에서 공급자 호스팅 OpenAI Search를 허용합니다. 기본값은 꺼짐이며, 전역으로 켠 경우에도 대화별로 끌 수 있습니다.",
              "values-pt-rBR": "Permite a Pesquisa OpenAI hospedada pelo provedor em conversas Responses compatíveis com OpenAI. Desativada por padrão; quando habilitada globalmente, pode ser desativada por conversa.",
              "values-ru": "Разрешить поиск OpenAI на стороне провайдера для совместимых с OpenAI диалогов Responses. По умолчанию отключено; при глобальном включении его можно отключать для отдельных диалогов.",
              "values-vi": "Cho phép OpenAI Search do nhà cung cấp lưu trữ cho các cuộc trò chuyện Responses tương thích OpenAI. Tắt theo mặc định; khi được bật toàn cục, vẫn có thể tắt cho từng cuộc trò chuyện.",
              "values-zh-rTW": "允許在與 OpenAI 相容的 Responses 對話中使用由供應商託管的 OpenAI Search。預設關閉；全域啟用後，仍可針對個別對話關閉。",
              "values-zh": "允许在兼容 OpenAI 的 Responses 对话中使用由提供商托管的 OpenAI Search。默认关闭；全局启用后，仍可针对单个对话关闭。",
          }

          for directory, translation in translations.items():
              path = Path("app/src/main/res") / directory / "strings.xml"
              text = path.read_text()
              if 'name="openai_search_global_desc"' in text:
                  raise RuntimeError(f"{path}: translation already present")
              pattern = re.compile(r'(^\s*<string name="openai_search">.*?</string>\s*$)', re.MULTILINE)
              match = pattern.search(text)
              if not match:
                  raise RuntimeError(f"{path}: openai_search anchor not found")
              indent = re.match(r'^\s*', match.group(1)).group(0)
              addition = f'{match.group(1)}\n{indent}<string name="openai_search_global_desc">{translation}</string>'
              path.write_text(text[:match.start()] + addition + text[match.end():])
          PY

      - name: Commit fixes to feature branch
        shell: bash
        run: |
          git config user.name "Agora patch workflow"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/test app/src/main/res
          if git diff --cached --quiet; then
            echo "No fixes to commit"
            exit 0
          fi
          git commit -m "test: satisfy OpenAI Search setting contracts"
          git push origin HEAD:feature/richer-web-search
