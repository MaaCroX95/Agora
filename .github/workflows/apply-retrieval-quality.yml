name: Apply retrieval quality patch

on:
  push:
    branches:
      - feature/richer-web-search
    paths:
      - .github/workflows/apply-retrieval-quality.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/richer-web-search
          fetch-depth: 0

      - name: Apply retrieval patch
        run: python3 .github/apply_retrieval_patch.py

      - name: Commit retrieval patch
        shell: bash
        run: |
          git config user.name "Agora patch workflow"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main development
          if git diff --cached --quiet; then
            echo "No retrieval changes to commit"
            exit 0
          fi
          git commit -m "feat: improve generic search retrieval quality"
          git push origin HEAD:feature/richer-web-search
