name: Apply retrieval quality patch

on:
  push:
    branches:
      - feature/richer-web-search
    paths:
      - .github/workflows/apply-retrieval-quality.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/richer-web-search
