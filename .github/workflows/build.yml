name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Run application and build-logic tests
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew -p build-logic test --stacktrace 2>&1 | tee gradle-ci.log
          ./gradlew :app:testFdroidDebugUnitTest :app:testPlayDebugUnitTest verifyKotlinFileSize -Pkotlin.daemon.jvmargs=-Xmx3584m --stacktrace --info 2>&1 | tee -a gradle-ci.log

      - name: Upload Gradle CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-ci-log
          path: gradle-ci.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            build-logic/build/reports/tests/
            build-logic/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret $name is not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Release APKs must use the permanent Agora Dev signing key; debug-signing fallback is disabled."
            exit 1
          fi

      - name: Restore and verify signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_SHA256: BA:4B:45:1D:80:48:90:22:35:B2:A9:0F:F3:4C:76:9E:02:BA:F1:4E:35:2C:03:97:89:42:42:DC:5C:EF:F3:BA
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release.jks"
          test -s "${{ github.workspace }}/release.jks"
          chmod 600 "${{ github.workspace }}/release.jks"

          certificate_output=$(keytool -J-Duser.language=en -J-Duser.country=US -list -v \
            -keystore "${{ github.workspace }}/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS")
          actual_sha256=$(printf '%s\n' "$certificate_output" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          if [ -z "$actual_sha256" ] || [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Configured signing certificate does not match the permanent Agora Dev certificate."
            exit 1
          fi
          echo "Configured signing certificate SHA-256: $actual_sha256"

          cat >> local.properties <<EOF
          storeFile=${{ github.workspace }}/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Configure CI version code
        run: echo "AGORA_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build PRoot runtime
        run: |
          chmod +x ./build-proot.sh
          ./build-proot.sh

      - name: Build F-Droid Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFdroidRelease

      - name: Verify PRoot runtime packaging
        run: |
          apk_path=$(find app/build/outputs/apk/fdroid/release -name '*.apk' -print -quit)
          test -n "$apk_path"
          apk_entries=$(mktemp)
          trap 'rm -f "$apk_entries"' EXIT
          unzip -Z1 "$apk_path" > "$apk_entries"
          for library in libproot_exec.so libproot_loader.so libtalloc.so; do
            entry="lib/arm64-v8a/$library"
            grep -Fxq "$entry" "$apk_entries" || {
              echo "Missing PRoot runtime library: $library" >&2
              exit 1
            }
          done

      - name: Verify APK signature
        env:
          EXPECTED_SHA256: BA:4B:45:1D:80:48:90:22:35:B2:A9:0F:F3:4C:76:9E:02:BA:F1:4E:35:2C:03:97:89:42:42:DC:5C:EF:F3:BA
        run: |
          set -euo pipefail
          apk_path=$(find app/build/outputs/apk/fdroid/release -name '*.apk' -print -quit)
          test -n "$apk_path"
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)
          test -x "$apksigner_path"
          signature_output=$("$apksigner_path" verify --verbose --print-certs "$apk_path")
          printf '%s\n' "$signature_output"
          signer_sha256=$(printf '%s\n' "$signature_output" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          expected_compact=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          signer_compact=$(printf '%s' "$signer_sha256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ -z "$signer_compact" ] || [ "$signer_compact" != "$expected_compact" ]; then
            echo "::error::Built APK signer does not match the permanent Agora Dev certificate."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agora-fdroid-release
          path: app/build/outputs/apk/fdroid/release/*.apk
