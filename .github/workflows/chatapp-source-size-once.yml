name: Repair upstream ChatApp source-size gate once

on:
  push:
    branches:
      - automation/chatapp-source-size-2026-09-03

permissions:
  contents: write

jobs:
  repair-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/upstream-chatapp-source-size
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Remove six no-op blank lines from oversized upstream source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/newoether/agora/ui/chat/ChatApp.kt')
          lines = p.read_text().splitlines()
          if len(lines) != 1004:
              raise SystemExit(f'Expected synced upstream ChatApp.kt at 1004 lines, found {len(lines)}')
          removed = 0
          out = []
          for idx, line in enumerate(lines, start=1):
              if idx >= 80 and removed < 6 and not line.strip():
                  removed += 1
                  continue
              out.append(line)
          if removed != 6:
              raise SystemExit(f'Expected to remove 6 blank lines, removed {removed}')
          p.write_text('\n'.join(out) + '\n')
          print(f'ChatApp.kt: {len(lines)} -> {len(out)} lines; behavior unchanged')
          PY
          git diff --check
          git diff -- app/src/main/java/com/newoether/agora/ui/chat/ChatApp.kt

      - name: Run full unit and source-size verification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew -p build-logic test --stacktrace
          ./gradlew :app:testFdroidDebugUnitTest :app:testPlayDebugUnitTest verifyKotlinFileSize --stacktrace

      - name: Commit and push baseline repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/newoether/agora/ui/chat/ChatApp.kt
          git commit -m "chore: restore Kotlin source-size gate after upstream sync"
          git push origin HEAD:fix/upstream-chatapp-source-size
