name: Compact settings repository

on:
  push:
    branches:
      - sync/upstream-2026-10-08

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-2026-10-08
          fetch-depth: 0

      - name: Compact declarations without changing behavior
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agora Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/newoether/agora/data/repository/SettingsRepository.kt')
          s = p.read_text()
          replacements = {
              '''    val openAiResponsesApiEnabled: StateFlow<Boolean> =\n        hot(settingsManager.openAiResponsesApiEnabled, false)\n''': '''    val openAiResponsesApiEnabled: StateFlow<Boolean> = hot(settingsManager.openAiResponsesApiEnabled, false)\n''',
              '''    val openAiWebSearchEnabled: StateFlow<Boolean> =\n        hot(settingsManager.openAiWebSearchEnabled, false)\n''': '''    val openAiWebSearchEnabled: StateFlow<Boolean> = hot(settingsManager.openAiWebSearchEnabled, false)\n''',
              '''    fun setOpenAiResponsesApiEnabled(enabled: Boolean) =\n        scope.launch { settingsManager.saveOpenAiResponsesApiEnabled(enabled) }\n''': '''    fun setOpenAiResponsesApiEnabled(enabled: Boolean) = scope.launch { settingsManager.saveOpenAiResponsesApiEnabled(enabled) }\n''',
              '''    fun setOpenAiWebSearchEnabled(enabled: Boolean) =\n        scope.launch { settingsManager.saveOpenAiWebSearchEnabled(enabled) }\n''': '''    fun setOpenAiWebSearchEnabled(enabled: Boolean) = scope.launch { settingsManager.saveOpenAiWebSearchEnabled(enabled) }\n''',
          }
          for old, new in replacements.items():
              assert old in s, old
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add app/src/main/java/com/newoether/agora/data/repository/SettingsRepository.kt
          git commit -m "style: keep SettingsRepository within source-size limit"
          git rm .github/workflows/compact-settings-sync.yml
          git commit -m "ci: remove settings compaction helper"
          git push origin HEAD:sync/upstream-2026-10-08
