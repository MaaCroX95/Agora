name: Build Agora Dev APK

on:
  push:
    branches: ["dev/agora-dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agora-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure Agora Dev identity
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          pattern = r'(?ms)^(\s*)create\("fdroid"\)\s*\{\s*\n\s*dimension\s*=\s*"store"\s*\n\s*\}'
          replacement = '''        create("fdroid") {
            dimension = "store"
            applicationIdSuffix = ".dev"
            versionNameSuffix = "-dev"
            resValue("string", "app_name", "Agora Dev")
        }'''
          out, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit(f"expected one fdroid product flavor block, found {count}")
          p.write_text(out)
          PY

      - name: Build PRoot runtime
        run: |
          chmod +x ./build-proot.sh
          ./build-proot.sh

      - name: Build Agora Dev APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFdroidRelease --stacktrace

      - name: Collect APK
        run: |
          apk_path=$(find app/build/outputs/apk/fdroid/release -name '*.apk' -print -quit)
          test -n "$apk_path"
          mkdir -p dist
          cp "$apk_path" dist/Agora-Dev.apk
          ls -lh dist/Agora-Dev.apk

      - name: Upload Agora Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: Agora-Dev-APK
          path: dist/Agora-Dev.apk
          if-no-files-found: error
          retention-days: 14
