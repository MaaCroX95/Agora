name: Build Agora Dev APK

on:
  push:
    branches: ["dev/agora-dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agora-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure Agora Dev identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle.kts")
          s = gradle.read_text()
          old = '        create("fdroid") {\n            dimension = "store"\n        }'
          new = '        create("fdroid") {\n            dimension = "store"\n            applicationIdSuffix = ".dev"\n            versionNameSuffix = "-dev"\n        }'
          if old not in s:
              raise SystemExit("fdroid product flavor block not found")
          gradle.write_text(s.replace(old, new, 1))

          strings = Path("app/src/main/res/values/strings.xml")
          s = strings.read_text()
          old = '<string name="app_name">Agora</string>'
          new = '<string name="app_name">Agora Dev</string>'
          if old not in s:
              raise SystemExit("app_name string not found")
          strings.write_text(s.replace(old, new, 1))
          PY

      - name: Build PRoot runtime
        run: |
          chmod +x ./build-proot.sh
          ./build-proot.sh

      - name: Build Agora Dev APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFdroidRelease --stacktrace

      - name: Collect APK
        run: |
          apk_path=$(find app/build/outputs/apk/fdroid/release -name '*.apk' -print -quit)
          test -n "$apk_path"
          mkdir -p dist
          cp "$apk_path" dist/Agora-Dev.apk
          ls -lh dist/Agora-Dev.apk

      - name: Upload Agora Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: Agora-Dev-APK
          path: dist/Agora-Dev.apk
          if-no-files-found: error
          retention-days: 14
