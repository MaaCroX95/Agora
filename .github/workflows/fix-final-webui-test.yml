name: Fix final WebUI test

# One-shot workflow for the final sync test fixture adaptation.
on:
  push:
    branches:
      - sync/upstream-2026-10-08
    paths:
      - .github/workflows/fix-final-webui-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-2026-10-08
          fetch-depth: 0
      - name: Enable global OpenAI Search gate in custom Responses availability test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agora Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/test/java/com/newoether/agora/webui/WebUiChatSessionTest.kt')
          s = p.read_text()
          old = '''        every { settings.enabledModels } returns MutableStateFlow(setOf(model))
        every { settings.customProviders } returns custom
        session.start()
        withTimeout(TIMEOUT_MS) { session.composerState.first { it.modelValid && it.controls?.openAiWebSearchAvailable == true } }
'''
          new = '''        every { settings.enabledModels } returns MutableStateFlow(setOf(model))
        every { settings.customProviders } returns custom
        every { settings.openAiWebSearchEnabled } returns MutableStateFlow(true)
        session.start()
        withTimeout(TIMEOUT_MS) { session.composerState.first { it.modelValid && it.controls?.openAiWebSearchAvailable == true } }
'''
          assert s.count(old) == 1, f'expected one custom Responses test fixture, found {s.count(old)}'
          p.write_text(s.replace(old, new, 1))
          PY
          git add app/src/test/java/com/newoether/agora/webui/WebUiChatSessionTest.kt
          git rm .github/workflows/fix-final-webui-test.yml
          git commit -m "test: enable OpenAI Search gate in custom Responses WebUI test"
          git push origin HEAD:sync/upstream-2026-10-08
