name: Fix schema newline

on:
  push:
    branches:
      - sync/upstream-2026-10-08
    paths:
      - .github/workflows/fix-schema-newline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-2026-10-08
          fetch-depth: 0
      - name: Replace escaped newline artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agora Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/newoether/agora/data/SettingsPreferenceSchema.kt')
          s = p.read_text()
          bad = 'internal val OPENAI_RESPONSES_API_ENABLED = booleanPreferencesKey("openai_responses_api_enabled")\\ninternal val OPENAI_WEB_SEARCH_ENABLED = booleanPreferencesKey("openai_web_search_enabled")'
          good = 'internal val OPENAI_RESPONSES_API_ENABLED = booleanPreferencesKey("openai_responses_api_enabled")\ninternal val OPENAI_WEB_SEARCH_ENABLED = booleanPreferencesKey("openai_web_search_enabled")'
          assert bad in s, 'expected escaped-newline merge artifact not found'
          s = s.replace(bad, good, 1)
          p.write_text(s)
          PY
          git add app/src/main/java/com/newoether/agora/data/SettingsPreferenceSchema.kt
          git rm .github/workflows/fix-schema-newline.yml
          git commit -m "fix: repair OpenAI Search preference declaration newline"
          git push origin HEAD:sync/upstream-2026-10-08
