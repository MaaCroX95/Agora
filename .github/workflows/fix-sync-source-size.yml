name: Fix sync source size

on:
  push:
    branches:
      - sync/upstream-2026-10-08
    paths:
      - .github/workflows/fix-sync-source-size.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-2026-10-08
          fetch-depth: 0
      - name: Compact settings declarations without behavior change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agora Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/newoether/agora/data/repository/SettingsRepository.kt')
          s = p.read_text()
          replacements = {
              '    val openAiResponsesApiEnabled: StateFlow<Boolean> =\n        hot(settingsManager.openAiResponsesApiEnabled, false)\n':
              '    val openAiResponsesApiEnabled: StateFlow<Boolean> = hot(settingsManager.openAiResponsesApiEnabled, false)\n',
              '    val openAiWebSearchEnabled: StateFlow<Boolean> =\n        hot(settingsManager.openAiWebSearchEnabled, false)\n':
              '    val openAiWebSearchEnabled: StateFlow<Boolean> = hot(settingsManager.openAiWebSearchEnabled, false)\n',
          }
          for old, new in replacements.items():
              assert old in s, f'missing expected declaration: {old!r}'
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          lines=$(wc -l < app/src/main/java/com/newoether/agora/data/repository/SettingsRepository.kt)
          echo "SettingsRepository.kt lines: $lines"
          test "$lines" -le 800
          git add app/src/main/java/com/newoether/agora/data/repository/SettingsRepository.kt
          git commit -m "style: keep SettingsRepository within source-size limit"
          git rm .github/workflows/fix-sync-source-size.yml
          git commit -m "ci: remove one-shot source-size fixer"
          git push origin HEAD:sync/upstream-2026-10-08
