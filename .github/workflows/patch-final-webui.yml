name: Patch final WebUI test

on:
  push:
    branches:
      - sync/upstream-2026-10-08

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sync/upstream-2026-10-08

      - name: Patch final WebUI fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agora Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/test/java/com/newoether/agora/webui/WebUiChatSessionTest.kt')
          s = p.read_text()
          test_name = 'fun customResponsesAvailabilityUsesItsIdentityAndTracksProtocolChanges()'
          start = s.index(test_name)
          insertion_point = s.index('        every { settings.customProviders } returns custom\n', start)
          insertion_point += len('        every { settings.customProviders } returns custom\n')
          line = '        every { settings.openAiWebSearchEnabled } returns MutableStateFlow(true)\n'
          assert line not in s[start:s.index('    @Test', start + len(test_name))]
          s = s[:insertion_point] + line + s[insertion_point:]
          p.write_text(s)
          PY
          git add app/src/test/java/com/newoether/agora/webui/WebUiChatSessionTest.kt
          git rm .github/workflows/patch-final-webui.yml
          git commit -m "test: enable OpenAI Search gate in custom Responses WebUI test"
          git push origin HEAD:sync/upstream-2026-10-08
