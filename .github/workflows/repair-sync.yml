name: Repair sync regression fixtures

on:
  push:
    branches:
      - sync/upstream-2026-09-14

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-2026-09-14
          fetch-depth: 0
      - name: Repair fork-specific test fixtures and locale parity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          provider_test = Path('app/src/test/java/com/newoether/agora/viewmodel/GenerationRequestBuilderProviderDisplayTest.kt')
          text = provider_test.read_text()
          old = '        every { settings.googleSearchEnabled } returns MutableStateFlow(true)\n'
          new = old + '        every { settings.openAiWebSearchEnabled } returns MutableStateFlow(true)\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('GenerationRequestBuilderProviderDisplayTest fixture anchor not found')
              text = text.replace(old, new, 1)
              provider_test.write_text(text)

          wiring_test = Path('app/src/test/java/com/newoether/agora/ui/chat/OpenAiNativeSearchWiringTest.kt')
          text = wiring_test.read_text()
          old = '            "effectiveSettings.openAiWebSearchEnabled == true && responsesApiEnabled",\n'
          new = (
              '            "settings.openAiWebSearchEnabled.value &&",\n'
              '            "effectiveSettings.openAiWebSearchEnabled == true &&",\n'
              '            "responsesApiEnabled,",\n'
          )
          new_text = ''.join(new)
          if '"settings.openAiWebSearchEnabled.value &&"' not in text:
              if old not in text:
                  raise SystemExit('OpenAiNativeSearchWiringTest assertion anchor not found')
              text = text.replace(old, new_text, 1)
              wiring_test.write_text(text)

          locale_dirs = [
              'values-ar', 'values-de', 'values-es', 'values-fr', 'values-ja',
              'values-ko', 'values-pt-rBR', 'values-ru', 'values-vi', 'values-zh',
              'values-zh-rTW',
          ]
          resource = '''<resources>\n    <string name="openai_search_global_desc">Allow provider-hosted OpenAI Search for OpenAI-compatible Responses conversations. Off by default; individual conversations can turn it off when enabled globally.</string>\n</resources>\n'''
          for locale in locale_dirs:
              target = Path('app/src/main/res') / locale / 'openai_search_fork.xml'
              target.write_text(resource)
          PY
          git rm .github/workflows/repair-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/test/java/com/newoether/agora/viewmodel/GenerationRequestBuilderProviderDisplayTest.kt \
                  app/src/test/java/com/newoether/agora/ui/chat/OpenAiNativeSearchWiringTest.kt \
                  app/src/main/res/values-*/openai_search_fork.xml
          git commit -m 'test: align fork search gate with upstream contracts'
          git push origin HEAD:sync/upstream-2026-09-14
