name: Sync latest upstream once

on:
  push:
    branches:
      - automation/upstream-sync-2026-09-04-latest

permissions:
  contents: write

jobs:
  sync-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-2026-09-04-latest
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Merge latest upstream master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/newo-ether/Agora.git
          git fetch upstream master
          echo "Upstream head: $(git rev-parse upstream/master)"
          echo "Local pre-merge head: $(git rev-parse HEAD)"

          set +e
          git merge --no-ff --no-edit upstream/master
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicted files:\n%s\n' "${conflicts[*]}"
            if [ "${#conflicts[@]}" -eq 1 ] && [ "${conflicts[0]}" = "app/src/main/java/com/newoether/agora/ui/chat/ChatApp.kt" ]; then
              # Our only local ChatApp delta is non-semantic blank-line trimming added solely to
              # satisfy the source-size gate after the prior upstream sync. Prefer the new upstream
              # ChatApp wholesale so all current upstream UI behavior is retained.
              git checkout --theirs -- app/src/main/java/com/newoether/agora/ui/chat/ChatApp.kt
              git add app/src/main/java/com/newoether/agora/ui/chat/ChatApp.kt
              git commit --no-edit
            else
              echo "::error::Unexpected upstream merge conflict set; refusing automatic resolution."
              exit 1
            fi
          fi

          echo "Merged head: $(git rev-parse HEAD)"
          echo "ChatApp.kt lines: $(wc -l < app/src/main/java/com/newoether/agora/ui/chat/ChatApp.kt)"
          # Do not use git diff --check over the upstream merge: upstream contains intentional
          # Markdown hard-break trailing spaces in a test fixture. Gradle/unit/source-size checks
          # below are the authoritative verification for this sync.

      - name: Preserve fork hosted-search test contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/test/java/com/newoether/agora/viewmodel/GenerationRequestBuilderProviderDisplayTest.kt")
          text = path.read_text()
          needle = (
              '        every { settings.googleSearchEnabled } returns MutableStateFlow(true)\n'
              '        every { settings.thinkingEnabled } returns MutableStateFlow(true)\n'
          )
          replacement = (
              '        every { settings.googleSearchEnabled } returns MutableStateFlow(true)\n'
              '        every { settings.openAiWebSearchEnabled } returns MutableStateFlow(true)\n'
              '        every { settings.thinkingEnabled } returns MutableStateFlow(true)\n'
          )
          if replacement not in text:
              if needle not in text:
                  raise SystemExit("Expected upstream RequestBuilderFixture anchor not found")
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY

          if ! git diff --quiet -- app/src/test/java/com/newoether/agora/viewmodel/GenerationRequestBuilderProviderDisplayTest.kt; then
            git add app/src/test/java/com/newoether/agora/viewmodel/GenerationRequestBuilderProviderDisplayTest.kt
            git commit -m "test: preserve hosted search master gate fixture"
          fi

      - name: Run full verification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          # The current upstream tree compiles substantially more Kotlin than our previous base.
          # Running both product-flavor test compilations concurrently exhausted the hosted runner's
          # Kotlin daemon (GC overhead limit). Give the Kotlin compiler a bounded 3 GiB heap and run
          # the two flavor gates sequentially; this changes only CI resources, not verification scope.
          cp gradle.properties gradle.properties.ci-backup
          trap 'mv -f gradle.properties.ci-backup gradle.properties 2>/dev/null || true' EXIT
          printf '\nkotlin.daemon.jvmargs=-Xmx3072m\n' >> gradle.properties

          ./gradlew -p build-logic test --max-workers=2 --stacktrace
          ./gradlew :app:testFdroidDebugUnitTest verifyKotlinFileSize --max-workers=2 --stacktrace
          ./gradlew :app:testPlayDebugUnitTest verifyKotlinFileSize --max-workers=2 --stacktrace

          mv gradle.properties.ci-backup gradle.properties
          trap - EXIT

      - name: Push synced branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:sync/upstream-2026-09-04-latest
