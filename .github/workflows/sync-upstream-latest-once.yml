name: Sync latest upstream once

on:
  push:
    branches:
      - automation/upstream-sync-2026-09-04-latest

permissions:
  contents: write

jobs:
  sync-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-2026-09-04-latest
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Merge latest upstream master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/newo-ether/Agora.git
          git fetch upstream master
          echo "Upstream head: $(git rev-parse upstream/master)"
          echo "Local pre-merge head: $(git rev-parse HEAD)"

          set +e
          git merge --no-ff --no-edit upstream/master
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicted files:\n%s\n' "${conflicts[*]}"
            if [ "${#conflicts[@]}" -eq 1 ] && [ "${conflicts[0]}" = "app/src/main/java/com/newoether/agora/ui/chat/ChatApp.kt" ]; then
              # Our only local ChatApp delta is non-semantic blank-line trimming added solely to
              # satisfy the source-size gate after the prior upstream sync. Prefer the new upstream
              # ChatApp wholesale so all current upstream UI behavior is retained.
              git checkout --theirs -- app/src/main/java/com/newoether/agora/ui/chat/ChatApp.kt
              git add app/src/main/java/com/newoether/agora/ui/chat/ChatApp.kt
              git commit --no-edit
            else
              echo "::error::Unexpected upstream merge conflict set; refusing automatic resolution."
              exit 1
            fi
          fi

          echo "Merged head: $(git rev-parse HEAD)"
          echo "ChatApp.kt lines: $(wc -l < app/src/main/java/com/newoether/agora/ui/chat/ChatApp.kt)"
          # Do not use git diff --check over the upstream merge: upstream contains intentional
          # Markdown hard-break trailing spaces in a test fixture. Gradle/unit/source-size checks
          # below are the authoritative verification for this sync.

      - name: Run full verification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew -p build-logic test --stacktrace
          ./gradlew :app:testFdroidDebugUnitTest :app:testPlayDebugUnitTest verifyKotlinFileSize --stacktrace

      - name: Push synced branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:sync/upstream-2026-09-04-latest
