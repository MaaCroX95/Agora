name: Update web-tool naming test once

on:
  push:
    branches:
      - automation/update-web-tool-test-2026-09-04

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/namespaced-web-tools
          fetch-depth: 0

      - name: Update legacy expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/test/java/com/newoether/agora/tool/ToolProviderTests.kt")
          text = p.read_text()

          replacements = [
              ('assertEquals("web_search", defs[0].function.name)',
               'assertEquals("agora_web_search", defs[0].function.name)'),
              ('assertEquals("web_fetch", defs[1].function.name)',
               'assertEquals("agora_web_fetch", defs[1].function.name)'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one occurrence: {old}")
              text = text.replace(old, new, 1)

          old = '''        assertTrue(provider.handles("web_search"))
                  assertTrue(provider.handles("web_fetch"))'''
          new = '''        assertTrue(provider.handles("agora_web_search"))
                  assertTrue(provider.handles("agora_web_fetch"))
                  assertTrue(provider.handles("web_search"))
                  assertTrue(provider.handles("web_fetch"))'''
          if text.count(old) != 1:
              raise SystemExit("legacy handles assertions mismatch")
          text = text.replace(old, new, 1)

          p.write_text(text)
          PY

          git diff --check
          git diff -- app/src/test/java/com/newoether/agora/tool/ToolProviderTests.kt

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/java/com/newoether/agora/tool/ToolProviderTests.kt
          git diff --cached --quiet && exit 0
          git commit -m "test: align generic web-tool names"
          git push origin HEAD:fix/namespaced-web-tools
