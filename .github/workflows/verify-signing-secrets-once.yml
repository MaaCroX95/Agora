name: Verify permanent signing secrets once

on:
  push:
    branches:
      - automation/verify-signing-secrets-2026-09-04

permissions:
  contents: read

jobs:
  verify-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate and verify permanent signing identity
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_SHA256: BA:4B:45:1D:80:48:90:22:35:B2:A9:0F:F3:4C:76:9E:02:BA:F1:4E:35:2C:03:97:89:42:42:DC:5C:EF:F3:BA
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret $name is missing or empty."
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/agora-dev-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"

          certificate_output=$(keytool -J-Duser.language=en -J-Duser.country=US -list -v \
            -keystore "$keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS")
          actual_sha256=$(printf '%s\n' "$certificate_output" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          if [ -z "$actual_sha256" ]; then
            echo "::error::Could not read the SHA-256 certificate fingerprint from the configured keystore."
            exit 1
          fi
          echo "Configured signing certificate SHA-256: $actual_sha256"
          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Configured signing certificate does not match the permanent Agora Dev certificate."
            exit 1
          fi

          printf 'Agora signing secret verification\n' > "$RUNNER_TEMP/payload.txt"
          (cd "$RUNNER_TEMP" && jar --create --file unsigned.jar payload.txt)
          jarsigner \
            -keystore "$keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -signedjar "$RUNNER_TEMP/signed.jar" \
            "$RUNNER_TEMP/unsigned.jar" \
            "$KEY_ALIAS" >/dev/null
          jarsigner -verify "$RUNNER_TEMP/signed.jar" >/dev/null
          echo "Permanent signing secrets verified successfully."

      - name: Ensure no signing material is persisted
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/agora-dev-release.jks" "$RUNNER_TEMP/unsigned.jar" "$RUNNER_TEMP/signed.jar" "$RUNNER_TEMP/payload.txt"
